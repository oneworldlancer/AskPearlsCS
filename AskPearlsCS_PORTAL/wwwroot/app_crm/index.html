<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AskPearls CRM</title>

    <style>
        .chat-page {
            height: 100vh;
            overflow: hidden;
        }

        .chat-layout {
            height: 100%;
        }

        .conversation-column {
            width: 340px;
            border-right: 1px solid var(--bs-border-color);
        }

        .customer-column {
            width: 360px;
            border-left: 1px solid var(--bs-border-color);
        }

        .chat-column {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }


        .chat-column {
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            flex: 0 0 auto;
        }

        .chat-body {
            flex: 1;
            overflow-y: auto;
        }

        .chat-footer {
            flex: 0 0 auto;
        }
    </style>

    <!-- Vendor CSS Files -->
    <link href="~/memberview/vendors/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <!--<link href="css/layout.css" rel="stylesheet" />-->

</head>
<body style="background-color:red;">

    <div class="container-fluid chat-page">

        <div class="row g-0 chat-layout">

            <!-- Conversation List -->
            <aside class="col-auto conversation-column">
                Conversation List
            </aside>

            <!-- Chat -->
            <main class="chat-column">

                <header class="chat-header">
                    chat-header
                </header>

                <section class="chat-body">
                    chat-body
                </section>

                <footer class="chat-footer">
                    chat-footer
                </footer>

            </main>
            <!--<main class="col chat-column">
                ...
            </main>-->
            <!-- Customer -->
            <aside class="col-auto customer-column">
                Customer
            </aside>

        </div>

    </div>

    <!--<script src="js/app.js"></script>-->
   
    <!-- Include this in your HTML -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://jquery.com" integrity="sha256-CH9is3XGZ4B7gnVscvC3SCDjHWMDoGl8AByAn90Vvs0=" crossorigin="anonymous"></script>

</body>
</html>
